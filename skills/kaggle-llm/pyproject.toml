[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kaggle-llm"
version = "0.1.0"
description = "Python and CLI inference through the Kaggle Benchmarks Model Proxy"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2", "jsonschema>=4.23,<5", "kaggle>=2.2.2,<3"]

[project.scripts]
kaggle-llm = "kaggle_llm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_llm"]
